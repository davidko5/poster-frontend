server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Long-cache hashed Vite assets.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown route -> index.html so React Router can handle it.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the entry HTML so deploys are picked up immediately.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
}
